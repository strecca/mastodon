---
# Closed community platform — no Fediverse federation.
# Removed: push, ingress, pull, fasp queues (federation — always empty here).
# Removed: indexing_scheduler (Elasticsearch not installed).
# Removed: trends_* schedulers (no value without federation or public discovery).
# Removed: follow_recommendations_scheduler (federation-graph based).
# Removed: fasp_* scheduler (FASP protocol not used).
# Slowed: cleanup schedulers from every 1 minute to every 15 minutes.
:concurrency: <%= ENV.fetch('SIDEKIQ_CONCURRENCY', 5) %>
:queues:
  - [default, 8]
  - [mailers, 2]
  - [scheduler]

:scheduler:
  :listened_queues_only: true
  :schedule:
    scheduled_statuses_scheduler:
      every: '5m'
      class: Scheduler::ScheduledStatusesScheduler
      queue: scheduler
    vacuum_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(3..5) %> * * *'
      class: Scheduler::VacuumScheduler
      queue: scheduler
    user_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(4..6) %> * * *'
      class: Scheduler::UserCleanupScheduler
      queue: scheduler
    ip_cleanup_scheduler:
      cron: '<%= Random.rand(0..59) %> <%= Random.rand(3..5) %> * * *'
      class: Scheduler::IpCleanupScheduler
      queue: scheduler
    pghero_scheduler:
      cron: '0 0 * * *'
      class: Scheduler::PgheroScheduler
      queue: scheduler
    accounts_statuses_cleanup_scheduler:
      every: '15m'
      class: Scheduler::AccountsStatusesCleanupScheduler
      queue: scheduler
    suspended_user_cleanup_scheduler:
      every: '15m'
      class: Scheduler::SuspendedUserCleanupScheduler
      queue: scheduler
    auto_close_registrations_scheduler:
      interval: 1 hour
      class: Scheduler::AutoCloseRegistrationsScheduler
      queue: scheduler
    community_moderation_reminder_scheduler:
      cron: '<%= Random.rand(0..59) %> 7 * * *'
      class: Scheduler::CommunityModerationReminderScheduler
      queue: scheduler
    community_stale_entry_scheduler:
      cron: '<%= Random.rand(0..59) %> 3 * * *'
      class: Scheduler::CommunityStaleEntryScheduler
      queue: scheduler
    community_visit_digest_scheduler:
      interval: 1 hour
      class: Scheduler::CommunityVisitDigestScheduler
      queue: scheduler
    event_import_scheduler:
      cron: '0 2 * * *'
      class: Scheduler::EventImportScheduler
      queue: scheduler
    expire_listings_scheduler:
      cron: '0 3 * * *'
      class: Scheduler::ExpireListingsScheduler
      queue: scheduler
